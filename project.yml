name: Daka

options:
  bundleIdPrefix: com.duanice
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    OTHER_SWIFT_FLAGS: "$(inherited) -disable-sandbox"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 22KH5PW5F7
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Daka:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Intents
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duanice.daka
        PRODUCT_NAME: Daka
        CODE_SIGN_ENTITLEMENTS: App/Daka.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "中关村实验室打卡 for 段冰洁"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Daka
        CFBundleDisplayName: "中关村实验室打卡 for 段冰洁"
        CFBundleShortVersionString: "1.3.1"
        CFBundleVersion: "8"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026 Duanice."
        CFBundleURLTypes:
          - CFBundleURLName: com.duanice.daka
            CFBundleURLSchemes:
              - daka
    dependencies:
      - target: DakaWidget
        embed: true

  DakaWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
      - path: Intents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duanice.daka.widget
        PRODUCT_NAME: DakaWidget
        CODE_SIGN_ENTITLEMENTS: Widget/DakaWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "中关村实验室打卡"
        CFBundleShortVersionString: "1.3.1"
        CFBundleVersion: "8"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  DakaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Daka
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duanice.daka.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Daka:
    build:
      targets:
        Daka: all
        DakaWidget: all
        DakaTests:
          - test
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DakaTests
    archive:
      config: Release
