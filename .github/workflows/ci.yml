name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install XcodeGen
        run: |
          curl -fsSL \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Verify generated project
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- Daka.xcodeproj

      - name: Run domain smoke tests
        run: |
          mkdir -p /tmp/daka-module-cache
          xcrun swiftc \
            -disable-sandbox \
            -module-cache-path /tmp/daka-module-cache \
            Shared/AppConstants.swift \
            Shared/AttendancePeriod.swift \
            Shared/AttendanceCalculator.swift \
            Tools/DomainSmokeTests.swift \
            -o /tmp/daka-domain-tests
          /tmp/daka-domain-tests

      - name: Build app and run tests
        run: |
          xcodebuild \
            -project Daka.xcodeproj \
            -scheme Daka \
            -configuration Debug \
            -derivedDataPath /tmp/daka-derived \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
