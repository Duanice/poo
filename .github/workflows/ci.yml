name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify generated project
        run: |
          xcodegen generate --spec project.yml
          git diff --exit-code -- Daka.xcodeproj

      - name: Run domain smoke tests
        run: |
          mkdir -p /tmp/daka-module-cache
          xcrun swiftc \
            -disable-sandbox \
            -module-cache-path /tmp/daka-module-cache \
            Shared/AppConstants.swift \
            Shared/AttendancePeriod.swift \
            Shared/AttendanceCalculator.swift \
            Tools/DomainSmokeTests.swift \
            -o /tmp/daka-domain-tests
          /tmp/daka-domain-tests

      - name: Build app and test bundle
        run: |
          xcodebuild \
            -project Daka.xcodeproj \
            -scheme Daka \
            -configuration Debug \
            -derivedDataPath /tmp/daka-derived \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
